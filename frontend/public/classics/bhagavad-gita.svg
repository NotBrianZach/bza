<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4780a"/>
      <stop offset="50%" stop-color="#e8960e"/>
      <stop offset="100%" stop-color="#c06a08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Sun rays -->
  <g transform="translate(200, 98)" stroke="#fff" stroke-width="1.5" opacity="0.2">
    <line x1="0" y1="-50" x2="0" y2="-35"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(30)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(60)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(90)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(120)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(150)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(180)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(210)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(240)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(270)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(300)"/>
    <line x1="0" y1="-50" x2="0" y2="-35" transform="rotate(330)"/>
  </g>
  <!-- Dharma wheel -->
  <g transform="translate(200, 98)" fill="none" stroke="#fff" opacity="0.85">
    <circle cx="0" cy="0" r="30" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" stroke-width="2"/>
    <!-- Spokes -->
    <g stroke-width="1.5">
      <line x1="0" y1="-8" x2="0" y2="-30"/>
      <line x1="0" y1="8" x2="0" y2="30"/>
      <line x1="-8" y1="0" x2="-30" y2="0"/>
      <line x1="8" y1="0" x2="30" y2="0"/>
      <line x1="-5.6" y1="-5.6" x2="-21.2" y2="-21.2"/>
      <line x1="5.6" y1="5.6" x2="21.2" y2="21.2"/>
      <line x1="5.6" y1="-5.6" x2="21.2" y2="-21.2"/>
      <line x1="-5.6" y1="5.6" x2="-21.2" y2="21.2"/>
    </g>
  </g>
  <text x="200" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#fff" letter-spacing="3" opacity="0.95">Bhagavad Gita</text>
  <text x="200" y="207" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fff" letter-spacing="5" opacity="0.45">THE SONG OF GOD</text>
</svg>