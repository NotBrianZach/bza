<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6f0"/>
      <stop offset="100%" stop-color="#e8e4d8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a040"/>
      <stop offset="100%" stop-color="#a08030"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Clean minimal border -->
  <rect x="20" y="20" width="360" height="220" rx="3" fill="none" stroke="#c8a040" stroke-width="0.8" opacity="0.35"/>
  <!-- Soft light rays from above -->
  <g opacity="0.08">
    <polygon points="200,0 160,140 240,140" fill="#c8a040"/>
    <polygon points="200,0 130,140 170,140" fill="#c8a040"/>
    <polygon points="200,0 230,140 270,140" fill="#c8a040"/>
  </g>
  <!-- Simple elegant cross -->
  <rect x="195" y="55" width="10" height="70" rx="2" fill="url(#gold)" opacity="0.7"/>
  <rect x="177" y="70" width="46" height="10" rx="2" fill="url(#gold)" opacity="0.7"/>
  <!-- Dove silhouette (peace/modern) -->
  <g transform="translate(200,45) scale(0.5)" opacity="0.25">
    <path d="M0,-8 C-5,-15 -15,-18 -20,-12 C-15,-8 -10,-5 -5,-5 C-10,0 -18,5 -22,2 C-15,10 -5,8 0,3 C5,8 15,10 22,2 C18,5 10,0 5,-5 C10,-5 15,-8 20,-12 C15,-18 5,-15 0,-8Z" fill="#a08030"/>
  </g>
  <text x="200" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#5a4a30" letter-spacing="2">The Holy Bible</text>
  <text x="200" y="194" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a7a60" letter-spacing="4">WORLD ENGLISH BIBLE</text>
  <text x="200" y="214" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#a09880" letter-spacing="2">Modern Translation</text>
</svg>