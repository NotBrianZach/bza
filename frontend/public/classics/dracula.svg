<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="50%" stop-color="#3a0a0a"/>
      <stop offset="100%" stop-color="#140606"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Moon -->
  <circle cx="200" cy="70" r="28" fill="#e0dcd0" opacity="0.12"/>
  <circle cx="200" cy="70" r="22" fill="#e0dcd0" opacity="0.08"/>
  <!-- Bat silhouette -->
  <g transform="translate(200, 95)" fill="#c03030" opacity="0.8">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="6" ry="12"/>
    <!-- Left wing -->
    <path d="M -4,-4 Q -25,-30 -45,-18 Q -35,-12 -30,-14 Q -28,-8 -22,-10 Q -18,-2 -12,-6 Q -8,2 -4,4 Z"/>
    <!-- Right wing -->
    <path d="M 4,-4 Q 25,-30 45,-18 Q 35,-12 30,-14 Q 28,-8 22,-10 Q 18,-2 12,-6 Q 8,2 4,4 Z"/>
    <!-- Ears -->
    <polygon points="-4,-11 -7,-18 -1,-13"/>
    <polygon points="4,-11 7,-18 1,-13"/>
  </g>
  <!-- Blood drip accents -->
  <line x1="60" y1="0" x2="60" y2="30" stroke="#8a1a1a" stroke-width="0.5" opacity="0.3"/>
  <line x1="340" y1="0" x2="340" y2="45" stroke="#8a1a1a" stroke-width="0.5" opacity="0.25"/>
  <text x="200" y="178" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#c03030" letter-spacing="6" opacity="0.9">Dracula</text>
  <text x="200" y="208" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6a3030" letter-spacing="4">BRAM STOKER</text>
</svg>