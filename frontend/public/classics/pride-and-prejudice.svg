<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c8c8"/>
      <stop offset="50%" stop-color="#d4a0a8"/>
      <stop offset="100%" stop-color="#c08890"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Decorative border -->
  <rect x="20" y="20" width="360" height="220" rx="4" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <!-- Floral motif -->
  <g transform="translate(200, 95)" opacity="0.7">
    <!-- Rose petals -->
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.7"/>
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.6" transform="rotate(45)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.6" transform="rotate(90)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.6" transform="rotate(135)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.5" transform="rotate(180)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.5" transform="rotate(225)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.5" transform="rotate(270)"/>
    <ellipse cx="0" cy="-10" rx="7" ry="14" fill="#8a3040" opacity="0.5" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="5" fill="#6a2030" opacity="0.8"/>
    <!-- Leaves -->
    <ellipse cx="-22" cy="18" rx="12" ry="5" fill="#5a7050" opacity="0.5" transform="rotate(-30, -22, 18)"/>
    <ellipse cx="22" cy="18" rx="12" ry="5" fill="#5a7050" opacity="0.5" transform="rotate(30, 22, 18)"/>
    <!-- Stem -->
    <line x1="0" y1="14" x2="0" y2="35" stroke="#5a7050" stroke-width="1.5" opacity="0.4"/>
  </g>
  <text x="200" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#3a1018" letter-spacing="2" opacity="0.85">Pride &amp; Prejudice</text>
  <text x="200" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6a3848" letter-spacing="4">JANE AUSTEN</text>
</svg>