<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2e1a"/>
      <stop offset="50%" stop-color="#0f4a2a"/>
      <stop offset="100%" stop-color="#082818"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#c8a030"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Decorative border -->
  <rect x="18" y="18" width="364" height="224" rx="6" fill="none" stroke="#c8a030" stroke-width="0.5" opacity="0.25"/>
  <rect x="24" y="24" width="352" height="212" rx="4" fill="none" stroke="#c8a030" stroke-width="0.3" opacity="0.15"/>
  <!-- Crescent -->
  <g transform="translate(200, 95)" opacity="0.85">
    <circle cx="0" cy="0" r="32" fill="url(#gold)"/>
    <circle cx="10" cy="-6" r="26" fill="#0f4a2a"/>
    <!-- Star -->
    <polygon points="30,0 33,-2.5 36,0 33,2.5" fill="url(#gold)" transform="rotate(-20, 30, 0)"/>
    <polygon points="32,-8 34,-11 36,-8 34,-5" fill="url(#gold)"/>
  </g>
  <text x="200" y="178" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f0d060" letter-spacing="3">The Quran</text>
  <text x="200" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5a8a6a" letter-spacing="4">PICKTHALL TRANSLATION</text>
</svg>