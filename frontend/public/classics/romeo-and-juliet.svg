<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A3A"/>
      <stop offset="50%" style="stop-color:#C2185B"/>
      <stop offset="100%" style="stop-color:#D4456A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <rect width="400" height="130" fill="url(#shine)"/>
  <!-- Two intertwined roses -->
  <g transform="translate(200,108)" opacity="0.2">
    <circle cx="-60" cy="0" r="70" fill="white"/>
    <circle cx="60" cy="0" r="70" fill="white"/>
  </g>
  <!-- Heart shape -->
  <g transform="translate(200,105)">
    <path d="M0,25 C0,25 -45,0 -45,-20 C-45,-38 -25,-45 0,-20 C25,-45 45,-38 45,-20 C45,0 0,25 0,25Z" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>
    <!-- Rose left -->
    <g transform="translate(-20,-15) scale(0.5)" opacity="0.8">
      <circle cx="0" cy="0" r="12" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
      <path d="M0,-8 C4,-4 4,4 0,8 C-4,4 -4,-4 0,-8Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
    </g>
    <!-- Rose right -->
    <g transform="translate(20,-15) scale(0.5)" opacity="0.8">
      <circle cx="0" cy="0" r="12" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
      <path d="M0,-8 C4,-4 4,4 0,8 C-4,4 -4,-4 0,-8Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
    </g>
    <!-- Stems intertwined -->
    <path d="M-20,-3 C-15,15 15,15 20,-3" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  </g>
  <!-- Title -->
  <text x="200" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="white" font-style="italic" letter-spacing="2">Romeo &amp; Juliet</text>
  <text x="200" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="rgba(255,255,255,0.6)" letter-spacing="4" text-transform="uppercase">WILLIAM SHAKESPEARE</text>
</svg>