  <text x="200" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2a2820" letter-spacing="4" opacity="0.85">Tao Te Ching</text>
  <text x="200" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6a6458" letter-spacing="5">LAO TZU</text>
