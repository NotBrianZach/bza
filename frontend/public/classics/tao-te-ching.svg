      <stop offset="0%" stop-color="#e8e4dc"/>
      <stop offset="40%" stop-color="#d4cfc4"/>
      <stop offset="100%" stop-color="#b8b0a4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
