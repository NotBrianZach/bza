<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="50%" style="stop-color:#283593"/>
      <stop offset="100%" style="stop-color:#0D1B4A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Greek temple -->
  <g transform="translate(200,95)">
    <!-- Pediment (triangle roof) -->
    <path d="M-55,-40 L0,-65 L55,-40Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
    <!-- Entablature -->
    <rect x="-60" y="-40" width="120" height="6" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <!-- Columns -->
    <line x1="-45" y1="-34" x2="-45" y2="25" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <line x1="-22" y1="-34" x2="-22" y2="25" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <line x1="0" y1="-34" x2="0" y2="25" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <line x1="22" y1="-34" x2="22" y2="25" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <line x1="45" y1="-34" x2="45" y2="25" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <!-- Column capitals -->
    <rect x="-49" y="-36" width="8" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="-26" y="-36" width="8" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="-4" y="-36" width="8" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="18" y="-36" width="8" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="41" y="-36" width="8" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
    <!-- Steps -->
    <rect x="-65" y="25" width="130" height="5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="-70" y="30" width="140" height="5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>
  <!-- Title -->
  <text x="200" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="white" letter-spacing="3">The Republic</text>
  <text x="200" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="4">PLATO</text>
</svg>