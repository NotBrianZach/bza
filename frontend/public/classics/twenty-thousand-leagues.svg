<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F5A"/>
      <stop offset="50%" style="stop-color:#0A3D5C"/>
      <stop offset="100%" style="stop-color:#061E2F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Subtle wave pattern -->
  <path d="M0,200 Q50,190 100,200 T200,200 T300,200 T400,200 L400,260 L0,260Z" fill="rgba(255,255,255,0.03)"/>
  <path d="M0,215 Q50,205 100,215 T200,215 T300,215 T400,215 L400,260 L0,260Z" fill="rgba(255,255,255,0.03)"/>
  <!-- Octopus tentacle silhouette -->
  <g transform="translate(200,95)" opacity="0.25">
    <path d="M-5,-45 C-5,-45 -8,-30 -5,-15 C-2,0 5,10 5,10" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-15,-40 C-20,-25 -30,-10 -40,5 C-45,12 -50,25 -45,30" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M15,-40 C20,-25 30,-10 40,5 C45,12 50,25 45,30" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-10,-42 C-15,-30 -22,-15 -25,5 C-26,15 -20,30 -18,35" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M10,-42 C15,-30 22,-15 25,5 C26,15 20,30 18,35" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-45" rx="20" ry="18" fill="white"/>
  </g>
  <!-- Submarine outline -->
  <g transform="translate(200,90)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
    <rect x="-5" y="-30" width="10" height="15" rx="3" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="0" y2="-40" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <circle cx="-20" cy="0" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <circle cx="20" cy="0" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <path d="M50,0 L65,-5 L65,5Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  </g>
  <!-- Bubbles -->
  <circle cx="140" cy="60" r="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <circle cx="260" cy="45" r="2" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <circle cx="155" cy="40" r="1.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <!-- Title -->
  <text x="200" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="white" letter-spacing="1">20,000 Leagues</text>
  <text x="200" y="195" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="rgba(255,255,255,0.5)" letter-spacing="3">UNDER THE SEA</text>
  <text x="200" y="225" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="4">JULES VERNE</text>
</svg>